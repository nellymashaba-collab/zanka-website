<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Property Inspection | Zanka Group</title>
<meta name="robots" content="noindex, nofollow">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#1F2A44', 'navy-deep': '#141C30', gold: '#C89B3C', 'gold-light': '#E4C77A', offwhite: '#F4F4F4' },
          fontFamily: { display: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .type-badge { padding: 0.35rem 1rem; border-radius: 9999px; font-weight: 600; font-size: 0.8rem; cursor: pointer; border: 2px solid transparent; }
  .type-badge[data-type="Move_In"] { background: #ECFDF5; color: #047857; }
  .type-badge[data-type="Move_In"].active { border-color: #047857; }
  .type-badge[data-type="Routine"] { background: #EFF6FF; color: #1D4ED8; }
  .type-badge[data-type="Routine"].active { border-color: #1D4ED8; }
  .type-badge[data-type="Move_Out"] { background: #FEF2F2; color: #B91C1C; }
  .type-badge[data-type="Move_Out"].active { border-color: #B91C1C; }
  .room-card { border: 1px solid #E5E7EB; border-radius: 0.75rem; background: #fff; }
  .room-drag-handle { cursor: grab; color: #9CA3AF; }
  .room-card.dragging { opacity: 0.4; }
  #signature-canvas { touch-action: none; border: 2px dashed #D1D5DB; border-radius: 0.75rem; background: #FAFAFA; width: 100%; height: 220px; }
  .progress-bar-fill { transition: width 0.3s ease; }
</style>
</head>
<body class="bg-offwhite antialiased">
<main class="max-w-4xl mx-auto px-5 sm:px-8 py-8">

  <div class="flex items-center justify-between mb-4">
    <div>
      <p class="eyebrow mb-1">Inspection Module</p>
      <h1 class="font-display font-bold text-navy text-3xl">Property Inspection</h1>
    </div>
    <a href="admin-dashboard.html" class="learn-more text-sm">&larr; Back</a>
  </div>

  <!-- Progress bar -->
  <div class="card p-4 mb-6">
    <div class="flex items-center justify-between mb-2">
      <span class="text-sm font-semibold text-navy">Completion</span>
      <span id="progress-percent" class="text-sm font-semibold text-navy">0%</span>
    </div>
    <div class="w-full bg-gray-100 rounded-full h-2.5">
      <div id="progress-bar-fill" class="progress-bar-fill bg-gold h-2.5 rounded-full" style="width:0%"></div>
    </div>
  </div>

  <!-- Type selector -->
  <div class="flex gap-3 mb-6">
    <button type="button" class="type-badge" data-type="Move_In">Move-In</button>
    <button type="button" class="type-badge" data-type="Routine">Routine</button>
    <button type="button" class="type-badge" data-type="Move_Out">Move-Out</button>
  </div>

  <!-- Property & tenant info -->
  <div class="card p-6 mb-6">
    <h2 class="font-display font-semibold text-navy text-lg mb-4">Property &amp; Lease</h2>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="field-label" for="insp-property">Property</label>
        <select class="field" id="insp-property" required></select>
      </div>
      <div>
        <label class="field-label" for="insp-lease">Lease <span class="text-gray-400 font-normal">(optional — leave blank for a vacant-unit inspection)</span></label>
        <select class="field" id="insp-lease"></select>
      </div>
      <div>
        <label class="field-label" for="insp-date">Inspection Date</label>
        <input class="field" type="date" id="insp-date">
      </div>
      <div>
        <label class="field-label" for="insp-inspector-name">Inspector Name</label>
        <input class="field" type="text" id="insp-inspector-name" placeholder="Auto-filled from your account">
      </div>
    </div>
  </div>

  <!-- Room configuration -->
  <div class="card p-6 mb-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
      <h2 class="font-display font-semibold text-navy text-lg">Rooms / Areas</h2>
      <div class="flex flex-wrap gap-2">
        <input type="text" id="room-search" class="field !w-auto !py-1.5 text-sm" placeholder="Search rooms...">
        <button type="button" id="expand-all" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-gray-300 hover:border-gold transition">Expand All</button>
        <button type="button" id="collapse-all" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-gray-300 hover:border-gold transition">Collapse All</button>
        <button type="button" id="reset-default-rooms" class="text-xs font-semibold px-3 py-1.5 rounded-full border border-gray-300 hover:border-gold transition">Reset to Default</button>
        <button type="button" id="add-room" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-navy text-white hover:bg-navy-deep transition">+ Add Room</button>
      </div>
    </div>
    <div id="rooms-container" class="space-y-4"></div>
  </div>

  <!-- Overall summary -->
  <div class="card p-6 mb-6">
    <h2 class="font-display font-semibold text-navy text-lg mb-4">Overall Property Condition</h2>
    <div class="grid sm:grid-cols-2 gap-4 mb-4">
      <div>
        <label class="field-label" for="overall-condition">Overall Condition</label>
        <select class="field" id="overall-condition">
          <option value="">Select</option>
          <option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option>
        </select>
      </div>
      <div>
        <label class="field-label" for="recommended-action">Recommended Action</label>
        <select class="field" id="recommended-action">
          <option value="">Select</option>
          <option value="No_Action">No action needed</option>
          <option value="Minor_Repairs">Minor repairs</option>
          <option value="Major_Repairs">Major repairs</option>
          <option value="Immediate_Attention">Immediate attention</option>
        </select>
      </div>
    </div>
    <label class="field-label" for="overall-comments">Additional Comments</label>
    <textarea class="field" id="overall-comments" rows="3"></textarea>
  </div>

  <!-- Signature -->
  <div class="card p-6 mb-6">
    <h2 class="font-display font-semibold text-navy text-lg mb-4">Inspector Signature</h2>
    <canvas id="signature-canvas"></canvas>
    <div class="flex gap-3 mt-3">
      <button type="button" id="signature-clear" class="btn btn-outline-navy !py-2 text-sm">Clear</button>
      <button type="button" id="signature-sign" class="btn btn-primary !py-2 text-sm">Sign</button>
    </div>
    <div class="grid sm:grid-cols-2 gap-4 mt-4">
      <div>
        <label class="field-label" for="signature-full-name">Full Name</label>
        <input class="field" type="text" id="signature-full-name">
      </div>
      <div>
        <label class="field-label" for="signature-title">Title / Role</label>
        <input class="field" type="text" id="signature-title" placeholder="e.g. Property Inspector">
      </div>
    </div>
    <p id="signature-date-display" class="text-xs text-gray-500 mt-2"></p>
  </div>

  <p id="submit-error" class="hidden text-sm text-red-600 bg-red-50 rounded-lg py-2.5 px-3.5 mb-4"></p>
  <p id="submit-success" class="hidden text-sm text-green-700 bg-green-50 rounded-lg py-2.5 px-3.5 mb-4"></p>

  <button type="button" id="submit-inspection" class="btn btn-primary w-full">Complete &amp; Submit Inspection</button>

</main>

<!-- Room card template -->
<template id="room-card-template">
  <div class="room-card p-4" draggable="true">
    <div class="flex items-center gap-3 mb-3">
      <span class="room-drag-handle text-lg">&#10495;&#10495;</span>
      <button type="button" class="room-collapse-toggle text-gray-400 hover:text-navy">&#9660;</button>
      <input type="text" class="room-name-input font-semibold text-navy text-sm flex-1 border-none bg-transparent focus:ring-0 focus:outline-none">
      <span class="room-status-badge text-xs font-semibold px-2.5 py-1 rounded-full bg-gray-100 text-gray-500">Incomplete</span>
      <button type="button" class="room-duplicate text-xs text-gray-400 hover:text-navy px-2">Duplicate</button>
      <button type="button" class="room-delete text-xs text-red-400 hover:text-red-600 px-2">Delete</button>
    </div>
    <div class="room-content space-y-3">
      <div class="room-items space-y-2"></div>
      <button type="button" class="room-add-item text-xs learn-more">+ Add checklist item</button>
    </div>
  </div>
</template>

<!-- Checklist item templates, one per type -->
<template id="item-rating-template">
  <div class="item-row flex items-center gap-2 flex-wrap">
    <input type="text" class="item-name-input field !py-1.5 !w-40 text-sm">
    <select class="item-rating-select field !py-1.5 !w-auto text-sm">
      <option value="">Rate</option>
      <option>Excellent</option><option>Good</option><option>Fair</option><option>Poor</option><option>Damaged</option>
    </select>
    <button type="button" class="item-delete text-xs text-red-400 hover:text-red-600">&times;</button>
  </div>
</template>

<template id="item-yesno-template">
  <div class="item-row flex items-center gap-2 flex-wrap">
    <input type="text" class="item-name-input field !py-1.5 !w-40 text-sm">
    <select class="item-yesno-select field !py-1.5 !w-auto text-sm">
      <option value="">—</option>
      <option value="true">Yes</option>
      <option value="false">No</option>
    </select>
    <button type="button" class="item-delete text-xs text-red-400 hover:text-red-600">&times;</button>
  </div>
</template>

<template id="item-text-template">
  <div class="item-row flex items-start gap-2 flex-wrap">
    <input type="text" class="item-name-input field !py-1.5 !w-40 text-sm">
    <textarea class="item-text-input field !py-1.5 text-sm flex-1" rows="1"></textarea>
    <button type="button" class="item-delete text-xs text-red-400 hover:text-red-600">&times;</button>
  </div>
</template>

<template id="item-photo-template">
  <div class="item-row flex items-center gap-2 flex-wrap">
    <input type="text" class="item-name-input field !py-1.5 !w-40 text-sm">
    <input type="file" class="item-photo-input text-xs" accept="image/*" multiple>
    <div class="item-photo-previews flex gap-1"></div>
    <button type="button" class="item-delete text-xs text-red-400 hover:text-red-600">&times;</button>
  </div>
</template>

<template id="new-item-type-picker-template">
  <div class="item-row flex items-center gap-2">
    <input type="text" class="new-item-name field !py-1.5 !w-40 text-sm" placeholder="Item name">
    <select class="new-item-type field !py-1.5 !w-auto text-sm">
      <option value="Rating">Rating</option>
      <option value="Yes_No">Yes/No</option>
      <option value="Text">Text</option>
      <option value="Photo">Photo</option>
    </select>
    <button type="button" class="new-item-confirm text-xs font-semibold text-gold">Add</button>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/inspection-manager.js"></script>

</body>
</html>
