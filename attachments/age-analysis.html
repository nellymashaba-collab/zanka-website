<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Analysis | Zanka Group</title>
<meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#1F2A44', 'navy-deep': '#141C30', gold: '#C89B3C', 'gold-light': '#E4C77A', offwhite: '#F4F4F4' },
          fontFamily: { display: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .panel{background:#fff;border-radius:1rem;box-shadow:0 1px 2px rgba(20,28,48,.05),0 8px 24px -12px rgba(20,28,48,.12);}
  .seg button[aria-pressed="true"]{background:#1F2A44;color:#fff;border-color:#1F2A44;}
  .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bucket-bar{height:8px;border-radius:999px;background:#EEF0F4;overflow:hidden}
  .bucket-bar span{display:block;height:100%;border-radius:999px}
  .b0{background:#9CA3AF}.b1{background:#C89B3C}.b2{background:#D97706}.b3{background:#EA580C}.b4{background:#DC2626}.b5{background:#991B1B}
  tbody tr.detail td{background:#FAFAF8}
  th.sticky-col, td.sticky-col{position:sticky;left:0;background:inherit;z-index:1}
  @media print{
    body{background:#fff !important}
    .no-print{display:none !important}
    .panel{box-shadow:none;border:1px solid #d1d5db}
    main{padding:0 !important;max-width:none !important}
    table{font-size:11px}
  }
</style>
</head>
<body class="bg-offwhite antialiased">
<main class="max-w-7xl mx-auto px-5 sm:px-8 py-8">

  <div class="flex flex-wrap items-end justify-between gap-4 mb-6">
    <div>
      <a id="back-link" href="index.html" class="no-print text-sm text-gray-500 hover:text-gold">&larr; Back</a>
      <p class="eyebrow mt-3 mb-1">Rent age analysis</p>
      <h1 class="font-display font-bold text-navy text-3xl">Age analysis</h1>
      <p id="scope-line" class="text-sm text-gray-500 mt-1"></p>
    </div>
    <div class="no-print flex flex-wrap gap-2">
      <button id="btn-csv" class="btn btn-outline-navy !py-2.5 text-sm">Download CSV</button>
      <button id="btn-print" class="btn btn-primary !py-2.5 text-sm">Save as PDF / print</button>
    </div>
  </div>

  <div class="panel p-5 mb-6 no-print">
    <div class="flex flex-wrap items-end gap-4">
      <div><label class="field-label" for="as-at">As at</label><input id="as-at" type="date" class="field !w-auto !py-2"></div>
      <div class="min-w-0"><label class="field-label" for="property">Property</label><select id="property" class="field !w-auto !py-2 max-w-full"><option value="">All properties</option></select></div>
      <div>
        <span class="field-label">Show</span>
        <div class="seg flex rounded-full border border-gray-300 overflow-hidden" role="group" aria-label="Report">
          <button type="button" data-view="arrears" aria-pressed="true" class="px-4 py-2 text-sm font-semibold text-navy border-r border-gray-300">Rental arrears</button>
          <button type="button" data-view="invoiced" aria-pressed="false" class="px-4 py-2 text-sm font-semibold text-navy">Rent invoiced</button>
        </div>
      </div>
    </div>
  </div>

  <p id="status" class="text-gray-500">Loading…</p>

  <div id="report" class="hidden">
    <p id="print-heading" class="hidden print:block text-sm text-gray-600 mb-4"></p>
    <section class="panel p-6 mb-6">
      <div class="flex flex-wrap items-baseline justify-between gap-3 mb-4">
        <h2 id="summary-title" class="font-display font-semibold text-navy text-lg"></h2>
        <p id="summary-total" class="font-display font-bold text-navy text-2xl num"></p>
      </div>
      <div id="buckets" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4"></div>
      <p id="summary-note" class="text-xs text-gray-500 mt-4"></p>
    </section>

    <section class="panel p-6">
      <h2 id="table-title" class="font-display font-semibold text-navy text-lg mb-1"></h2>
      <p id="table-note" class="text-sm text-gray-500 mb-4"></p>
      <div class="overflow-x-auto"><table class="w-full text-sm" id="table"></table></div>
    </section>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/age-analysis.js"></script>
</body>
</html>
