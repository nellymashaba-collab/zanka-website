<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence of Service | Zanka Group</title>
<meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { navy: '#1F2A44', 'navy-deep': '#141C30', gold: '#C89B3C', 'gold-light': '#E4C77A', offwhite: '#F4F4F4' },
          fontFamily: { display: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .panel{background:#fff;border-radius:1rem;box-shadow:0 1px 2px rgba(20,28,48,.05),0 8px 24px -12px rgba(20,28,48,.12);}
  .pill{display:inline-block;font-size:.72rem;font-weight:600;padding:.2rem .65rem;border-radius:9999px;white-space:nowrap;}
  .kv{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:.35rem 1rem;}
  .kv dt{color:#6b7280;} .kv dd{color:#1F2A44;word-break:break-word;}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;}
  @media (max-width:520px){.kv{grid-template-columns:1fr;} .kv dt{margin-top:.4rem;}}
  @media print{
    body{background:#fff !important;}
    .no-print{display:none !important;}
    .panel{box-shadow:none;border:1px solid #d1d5db;}
    .record{break-before:page;} .record:first-of-type{break-before:auto;}
    .avoid-break{break-inside:avoid;}
    main{padding:0 !important;max-width:none !important;}
  }
</style>
</head>
<body class="bg-offwhite antialiased">
<main class="max-w-4xl mx-auto px-5 sm:px-8 py-8">

  <div class="no-print flex flex-wrap items-center justify-between gap-4 mb-6">
    <div>
      <a href="tenancies.html#arrears" class="text-sm text-gray-500 hover:text-gold">&larr; Tenancies</a>
      <p class="eyebrow mt-3 mb-1">Tenancy management</p>
      <h1 class="font-display font-bold text-navy text-3xl">Evidence of service</h1>
    </div>
    <button id="btn-print" class="btn btn-primary !py-2.5 text-sm hidden">Save as PDF / print</button>
  </div>

  <p id="ev-status" class="text-gray-500">Loading…</p>
  <div id="ev-register" class="hidden"></div>
  <div id="ev-records"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/notice-evidence.js"></script>
</body>
</html>
