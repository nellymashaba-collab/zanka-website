<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Log In | Zanka Group</title>
<meta name="description" content="Internal administrative login for Zanka Group staff.">
<meta name="robots" content="noindex, nofollow">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: '#1F2A44',
            'navy-deep': '#141C30',
            gold: '#C89B3C',
            'gold-light': '#E4C77A',
            offwhite: '#F4F4F4'
          },
          fontFamily: {
            display: ['Playfair Display', 'Georgia', 'serif'],
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif']
          }
        }
      }
    }
  </script>

<link rel="stylesheet" href="assets/css/style.css">

</head>
<body class="bg-white antialiased">
<a href="#main" class="skip-link">Skip to content</a>
<main id="main">

<section class="bg-offwhite py-16 md:py-24 min-h-screen flex items-center">
  <div class="max-w-md mx-auto px-5 sm:px-8 w-full">
    <div class="text-center mb-8">
      <a href="index.html" class="inline-flex items-center gap-2.5 mb-6">
        <span class="w-9 h-9 rounded-md bg-gold text-navy-deep font-display font-bold text-lg flex items-center justify-center">Z</span>
        <span class="leading-none">
          <span class="block font-display font-bold text-navy text-lg tracking-tight">ZANKA</span>
          <span class="block text-[10px] tracking-[0.25em] text-gray-500 font-semibold">GROUP</span>
        </span>
      </a>
      <div class="icon-badge mx-auto mb-4"><svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3 4 6v6c0 5 3.4 8.4 8 9 4.6-.6 8-4 8-9V6l-8-3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"/></svg></div>
      <p class="eyebrow mb-2">Internal Access</p>
      <h1 class="font-display font-bold text-navy text-3xl">Admin Log In</h1>
    </div>
    <div class="card p-8">
      <p id="auth-error" class="hidden text-sm text-red-600 bg-red-50 rounded-lg py-2.5 px-3.5 mb-5"></p>
      <form id="login-form" class="space-y-5">
        <div>
          <label class="field-label" for="email">Email Address</label>
          <input class="field" type="email" id="email" name="email" required>
        </div>
        <div>
          <div class="flex items-center justify-between mb-0.5">
            <label class="field-label !mb-0" for="password">Password</label>
            <a href="forgot-password.html" class="text-xs font-semibold text-gold hover:underline">Forgot password?</a>
          </div>
          <input class="field" type="password" id="password" name="password" required>
        </div>
        <button id="login-submit" type="submit" class="btn btn-primary w-full">Log in</button>
      </form>
    </div>
    <p class="text-center text-xs text-gray-400 mt-6">
      Admin accounts are provisioned manually by Zanka Group and are not available via public sign-up.
    </p>
  </div>
</section>

</main>
<script src="assets/js/main.js"></script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script>handleLogin('admin', 'admin-dashboard.html');</script>

</body>
</html>
